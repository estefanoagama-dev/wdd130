<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item label-narrow">
                    <label for="fullname">Full Name:</label>
                    <input type="text" name="fullname" id="fullname" required>
                </div>

                <div class="form-item label-narrow">
                    <label for="useremail">Email:</label>
                    <input type="email" name="useremail" id="useremail" required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Questions</legend>

                <div class="form-item label-wide">
                    <label for="browser">What is your favourite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="opera">Opera</option>
                    </select>
                </div>

                <div class="form-item label-wide">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" name="pet" id="pet">
                </div>

                <div class="form-item">
                    <label for="places">List the places you have lived:</label>
                    <textarea rows="3" name="places" id="places" placeholder="Pelileo, Ecuador; Paita, Peru; Quito, Ecuador"></textarea>
                </div>

            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>© 2026 | Estefano Panta | WDD 130 | User Poll Form</p>

    </footer>
</body>

</html>
