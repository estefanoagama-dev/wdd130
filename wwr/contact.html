<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | LESFO Whitewater Adventures</title>

    <meta name="description" content="Contact LESFO Whitewater Adventures in Pelileo, Ecuador, for reservations, general inquiries, and information about our white water rafting adventures.">

    <meta name="author" content="Estefano Jose Panta Agama">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/lesfo-logo.jpg" alt="LESFO Whitewater Adventures company logo" width="300">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="company-information">
            <h1>LESFO Whitewater Adventures</h1>

            <ul class="contact-details">
                <li>4-45 Quiz-Quiz and Padre Chacon</li>
                <li>Pelileo, Ecuador</li>
                <li><a href="tel:+593969737967">+593 969737967</a></li>
                <li><a href="mailto:estefanoagama@gmail.com">estefanoagama@gmail.com</a></li>
            </ul>
        </div>

        <div class="contact-information">

            <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d652.8505171993672!2d-78.5432264804783!3d-1.3280004113854855!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2s!5e0!3m2!1sen!2sec!4v1795554238284!5m2!1sen!2sec" width="300" height="250" allowfullscreen loading="lazy" title="LESFO Whitewater Adventures location map">
            </iframe>

            <form>

                <div class="form-group">

                    <label for="user-name">Name:</label>
                    <input type="text" name="user-name" id="user-name" placeholder="Enter your full name." required>

                    <label for="user-email">Email:</label>
                    <input type="email" name="user-email" id="user-email" placeholder="Enter a valid email." required>

                </div>

                <fieldset aria-labelledby="purpose-heading">

                    <div class="purpose-title" id="purpose-heading">
                        Message Purpose
                    </div>

                    <div class="message-purpose">

                        <label for="general-inquiry">
                            <input type="radio" name="message-purpose" id="general-inquiry" value="General Inquiry" required>
                            General Inquiry
                        </label>

                        <label for="reservation-question">
                            <input type="radio" name="message-purpose" id="reservation-question" value="Reservation Question">
                            Reservation Question
                        </label>

                        <label for="website-suggestion">
                            <input type="radio" name="message-purpose" id="website-suggestion" value="Website Suggestion">
                            Website Suggestion
                        </label>

                    </div>

                </fieldset>

                <label for="user-message">Message:</label>

                <textarea rows="3" name="user-message" id="user-message" placeholder="Type here" required></textarea>

                <div class="newsletter">

                    <label for="subscription">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <input type="checkbox" name="subscription" id="subscription">

                </div>

                <button type="submit">Get in Touch!</button>

            </form>

        </div>

        <div class="employee-profile">

            <h2>We Are Here to Serve You</h2>

            <figure class="profile">
                <img src="images/employee_1.jpg" alt="Male rafting guide wearing safety equipment" width="256" height="256">

                <figcaption>
                    Carlos Mendoza - Head Rafting Guide
                </figcaption>
            </figure>

            <figure class="profile">
                <img src="images/employee_2.jpeg" alt="Female rafting safety instructor" width="256" height="256">

                <figcaption>
                    Sofia Anderson - Safety Instructor
                </figcaption>
            </figure>

            <figure class="profile">
                <img src="images/employee_3.jpeg" alt="Male rafting operations manager" width="256" height="256">

                <figcaption>
                    Daniel Thompson - Operations Manager
                </figcaption>
            </figure>

        </div>

    </main>

    <footer>

        <p>© 2026 LESFO Whitewater Adventures | Estefano Jose Panta Agama</p>

        <nav class="socialmedia">

            <a href="https://www.tiktok.com/">
                <img src="images/tiktok-logo.jpg" alt="TikTok" width="50">
            </a>

            <a href="https://facebook.com">
                <img src="images/facebook-logo.jpg" alt="Facebook" width="50">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-logo.jpg" alt="Instagram" width="50">
            </a>

        </nav>

    </footer>

</body>

</html>
